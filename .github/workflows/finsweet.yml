name: Check Finsweet
on:
  push:
    branches: [main]
    paths: ['public/projects/finsweet/**', 'scripts/check-finsweet.mjs', '.github/workflows/finsweet.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-finsweet.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finsweet-screenshots
          path: finsweet-screenshots
